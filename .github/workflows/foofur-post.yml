name: Foofur Tweet Bot

on:
  schedule:
    # Europa piekmomenten (CET ~ UTC+1)
    - cron: '6 7 * * *'   # 08:06 CET (07:06 UTC)
    - cron: '6 11 * * *'  # 12:06 CET (11:06 UTC)
    - cron: '6 15 * * *'  # 16:06 CET (15:06 UTC)

    # VS piekmomenten (EST ~ UTC-5)
    - cron: '6 13 * * *'  # 08:06 EST (13:06 UTC)
    - cron: '6 17 * * *'  # 12:06 EST (17:06 UTC)
    - cron: '6 21 * * *'  # 16:06 EST (21:06 UTC)

    # Azië piekmomenten (UTC+8)
    - cron: '6 0 * * *'   # 08:06 CST (00:06 UTC)
    - cron: '6 4 * * *'   # 12:06 CST (04:06 UTC)

  workflow_dispatch:  # Handmatig starten

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Foofur Bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
